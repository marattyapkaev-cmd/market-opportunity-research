function ScoreDots({ value }: { value: number }) {
  const theme = useHostTheme();
  return (
    <Row gap={4}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span
          key={n}
          style={{
            width: 9,
            height: 9,
            borderRadius: 9,
            display: "inline-block",

            border: `1px solid ${n <= value ? theme.accent.primary : theme.stroke.secondary}`,
          }}
        />
      ))}
    </Row>
  );
}
