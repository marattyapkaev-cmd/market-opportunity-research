const categories = ["Все", "Финансы и здоровье", "Медиа и образование", "Commerce и lifestyle", "Travel и mobility"] as const;
const fmt = (value: number) => new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 1 }).format(value);
const tone = (confidence: Market["confidence"]) =>
  confidence === "высокая" ? "success" : confidence === "средняя" ? "info" : "warning";

function RussianB2CEntryOpportunities() {
  const theme = useHostTheme();
  const [category, setCategory] = useCanvasState<(typeof categories)[number]>("b2c-category", "Все");
  const [query, setQuery] = useCanvasState("b2c-query", "");
  const [topOnly, setTopOnly] = useCanvasState("b2c-top-only", false);

  const filtered = markets
    .filter((m) => category === "Все" || m.category === category)
    .filter((m) => !topOnly || m.score >= 4)
    .filter((m) => `${m.name} ${m.leaders} ${m.wedge}`.toLocaleLowerCase("ru").includes(query.toLocaleLowerCase("ru")))

          выручкой цифрового слоя и текущей монетизацией. В B2C реальный SAM стартапа обычно намного меньше TAM из-за CAC,
          бесплатных заменителей, сетевых эффектов и низкой готовности платить. GMV товаров, поездок, премий и клиентских активов

        </Callout>
      </Stack>

        <Stat value={markets.length} label="рынков в итоговой карте" />

        <Stat value="62 млн" label="пользователей мультиподписок, 2025" tone="info" />

          <Stack gap={12}>
            <Row gap={8} wrap>

                  {item}
                </Button>

                Только привлекательные
              </Button>
            </Row>

              value={query}
              onChange={setQuery}
              type="search"
              placeholder="Поиск по рынку, лидеру или продуктовой гипотезе…"
              style={{ width: "100%" }}
            />
          </Stack>
        </CardBody>
      </Card>

      <Stack gap={10}>
        <H2>Сравнительная карта</H2>
        <Table
          headers={["Рынок", "Категория", "Net revenue", "TAM", "TAM / рынок", "Стадия", "Динамика", "Вход", "Уверенность"]}
          rows={filtered.map((m) => [
            <Text weight="semibold">{m.name}</Text>,
            m.category,
            `${fmt(m.volume)} млн ₽`,
            `${fmt(m.tam)} млн ₽`,
            `${(m.tam / m.volume).toFixed(1)}×`,
            m.stage,
            m.growth,
            <Text weight="semibold">{m.score}/5</Text>,
            <Pill tone={tone(m.confidence)}>{m.confidence}</Pill>,

          columnAlign={["left", "left", "right", "right", "right", "left", "right", "right", "left"]}
          striped
          stickyHeader
          style={{ maxHeight: 720 }}

      </Stack>

      <Grid columns={2} gap={20}>
        <Stack gap={8}>
          <H2>Лучшие окна для независимого стартапа</H2>

                  <Text>{m.whitespace}</Text>
                </Stack>
                <Stack gap={8}>
                  <H3>Состояние и перспектива</H3>
                  <Text><b>{m.stage}; {m.growth}.</b> {m.outlook}</Text>
                  <Callout tone={m.score >= 4 ? "success" : "info"} title="Реалистичная точка входа">
                    {m.wedge}
                  </Callout>
                  <Text style={{ color: theme.text.secondary }}>
                    Основной источник: <Link href={m.url}>{m.source}</Link>
                  </Text>
                </Stack>
              </Grid>
            </Stack>
          </CollapsibleSection>
        ))}
      </Stack>

      <Stack gap={8}>
        <H2>Методика</H2>
        <Text>
          Net revenue — доход цифровой платформы или валовая маржа цифрового сервиса, а не GMV базовой транзакции.
          Если источник раскрывал только GMV, применён явно указанный отраслевой take rate. TAM рассчитан как достижимая
          аудитория × зрелый ARPU либо зрелый GMV × net take rate.
        </Text>
        <Text>
          Высокая уверенность означает прямой рыночный замер или несколько сопоставимых источников; средняя — один расчётный
          компонент; низкая — bottom-up с несколькими допущениями. Перед запуском обязательны problem interviews, проверка
          willingness-to-pay и расчёт достижимого SAM/SOM.
        </Text>
        <Text style={{ color: theme.text.secondary }}>
          Макроконтекст: <Link href="https://mediascope.net/upload/iblock/719/qj72l2e27uzgi28g1pq43vf4q2svcgiy/Mediascope_%D0%92_%D1%81%D0%BC%D0%B0%D1%80%D1%82%D1%84%D0%BE%D0%BD%D0%B5.pdf">Mediascope</Link>
          {" "}оценивает мобильную аудиторию РФ в 105 млн человек;{" "}
          <Link href="https://frankrg.com/news/ne-po-tsene-a-po-tsennosti-kak-rossiyane-vybirali-podpiski-v-2025-godu">Frank RG</Link>
          {" "}— 62 млн пользователей мультисервисных подписок. Экстенсивный рост аудитории почти завершён: новый продукт должен
